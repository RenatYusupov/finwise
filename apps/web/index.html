<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#2D7DD2" />
    <!-- Prevent Telegram WebView from serving stale cached index.html -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>FinWise</title>
    <!-- GitHub Pages SPA: restore path encoded by 404.html.
         BrowserRouter with basename="/finwise" needs the real pathname,
         not the ?p= query param that 404.html encodes on 404 redirects. -->
    <script>
      (function() {
        var p = window.location.search.slice(1).split('&').reduce(function(acc, s) {
          var r = s.split('=');
          acc[decodeURIComponent(r[0])] = decodeURIComponent(r.slice(1).join('='));
          return acc;
        }, {});
        if (p.p !== undefined) {
          window.history.replaceState(null, null,
            window.location.pathname.split('/').slice(0, 2).join('/') +
            '/' + p.p.replace(/&/, '?').replace(/%23/, '#')
          );
        }
      })();
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
